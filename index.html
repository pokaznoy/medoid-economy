<!DOCTYPE html>
<html lang="uk">
<head>

  <title>Економіка Медоїдів</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 text-gray-800">

  </div>

  <div class="flex flex-col items-center gap-2 text-xs text-gray-500">

    <div>
      Дані:
      <a href="https://docs.google.com/spreadsheets/d/ТУТ_ТВОЄ_ID"
         target="_blank"
         class="underline hover:text-black">

      </a>
    </div>

    <div>
      Код:
      <a href="https://github.com/pokaznoy/medoid-economy"
         target="_blank"

</footer>

  </div>
