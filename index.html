<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Економіка Медоїдів</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-[#f3efe6] text-[#2b241c]">

  <div class="max-w-4xl mx-auto my-6 p-5 bg-[#fffaf0] rounded-2xl shadow-md border border-[#e5dcc8]">

    <header class="mb-6 text-center">
      <h1 class="text-3xl font-semibold tracking-tight">
        🦡 Економіка Медоїдів
      </h1>
      <p class="mt-2 text-sm text-[#6b5a46]">
        Спільний каталог маленьких справ, майстерень, послуг і проєктів
      </p>
    </header>

    <input
      id="search"
      type="text"
      placeholder="Пошук за назвою, власником, описом або категорією..."
      class="w-full p-3 mb-4 border border-[#e5dcc8] bg-[#fdfaf3] rounded-xl focus:outline-none focus:ring-2 focus:ring-[#d89b2b]"
    />

    <div id="filters" class="flex flex-wrap gap-2 mb-5"></div>

    <div id="cards" class="grid gap-4"></div>

    <footer class="mt-12 pt-6 border-t border-[#e5dcc8] text-sm text-[#5a4a3a]">

      <div class="text-center mb-5">
        Хочеш додати бізнес?
        <br>
        <a href="https://forms.gle/gur1BNjEr6W9PoFo6"
           target="_blank"
           class="text-[#b7791f] underline hover:text-[#92400e]">
          Заповни форму
        </a>
      </div>

      <div class="flex flex-col items-center gap-2 text-xs text-[#6b5a46]">

        <div>
          Дані:
          <a href="https://docs.google.com/spreadsheets/d/ТУТ_ТВОЄ_ID"
             target="_blank"
             class="underline hover:text-[#2b241c]">
            Google Sheets
          </a>
        </div>

        <div>
          Код:
          <a href="https://github.com/pokaznoy/medoid-economy"
             target="_blank"
             class="underline hover:text-[#2b241c]">
            GitHub репозиторій
          </a>
        </div>

        <div class="opacity-70 mt-2">
          🦡 Економіка Медоїдів — дошка своїх справ
        </div>

      </div>

    </footer>

  </div>

  <script src="data.js"></script>
  <script src="app.js"></script>

</body>
</html>
