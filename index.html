<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Економіка Медоїдів</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 text-gray-800">

  <div class="max-w-4xl mx-auto p-4">

    <h1 class="text-2xl font-bold mb-4 text-center">
      🦡 Економіка Медоїдів
    </h1>

    <!-- Пошук -->
    <input
      id="search"
      type="text"
      placeholder="Пошук..."
      class="w-full p-3 mb-4 border rounded-xl"
    />

    <!-- Категорії -->
    <div id="filters" class="flex flex-wrap gap-2 mb-4"></div>

    <!-- Картки -->
    <div id="cards" class="grid gap-4"></div>

    <!-- Футер -->
    <div class="mt-8 text-center text-sm text-gray-500">
      Хочеш додати бізнес?
      <br>
      <a href="https://forms.gle/gur1BNjEr6W9PoFo6" class="text-blue-500 underline">
        Заповни форму
      </a>
    </div>

  </div>

  <script src="data.js"></script>
  <script src="app.js"></script>

</body>
</html>
